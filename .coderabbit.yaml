# CodeRabbit 설정 예시
language: "ko-KR" # 리뷰 언어를 한국어로 설정

reviews:
  profile: "chill" # chill, standard, assertive 중 선택 (assertive가 더 깊은 분석)
  request_review_mode: "auto" # 자동 리뷰 설정
  instructions: |
    모든 리뷰와 답변은 반드시 한국어(Korean)로 작성해 주세요. 
    코드의 가독성, 유지보수성, 성능 향상에 중점을 두고 분석해 주세요.
    예상 가능한 버그나 문제점도 함께 지적해 주세요.

  # 컨텍스트 및 분석 범위 관련 (핵심!)
  high_level_summary: true # 프로젝트 전체 맥락 요약 사용
  path_filters:
    - "!dist/**"
    - "!**/node_modules/**"

chat:
  auto_reply: true # AI와 대화하며 컨텍스트 추가 확장 가능
